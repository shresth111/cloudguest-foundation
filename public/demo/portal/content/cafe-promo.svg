<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-label="Cafe promotion: free pastry with any coffee">
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5651d"/>
      <stop offset="1" stop-color="#e0a066"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="640" rx="28" fill="url(#p)"/>
  <g fill="#fff8ef">
    <text x="500" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" text-anchor="middle">Brew &amp; Bytes</text>
    <text x="500" y="330" font-family="Georgia, serif" font-size="96" font-weight="800" text-anchor="middle">Free Pastry</text>
    <text x="500" y="410" font-family="Georgia, serif" font-size="40" text-anchor="middle" opacity="0.92">with any coffee, today only</text>
  </g>
  <g fill="none" stroke="#fff8ef" stroke-width="4" opacity="0.85">
    <rect x="360" y="470" width="280" height="76" rx="38"/>
  </g>
  <text x="500" y="520" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#fff8ef">Show at counter</text>
</svg>
