name: CI

# The frontend has had no CI at all. The Dockerfile's builder stage runs
# `bun run build` and nothing else -- no tsc, no eslint, no tests -- so
# every gate below is currently enforced only by whoever remembers to run
# it locally.
#
# Everything here is verified green on `feat/guided-setup-and-provisioning-fixes`
# as of 2026-08-22, so this starts life passing and any red is a real
# regression:
#   tsc --noEmit ........ 0 errors across 751 files
#   eslint . ............ 0 errors, 56 warnings
#   test:portal-cna ..... 7 checks
#   test:signin-fields .. 23 checks
#   test:fw-order ....... 7 checks
#   test:output-analyser  116 checks
#   test:a11y ........... sentinel only
#   test:manual-wizard .. 113 checks
#   test:setup-script ... 415 checks (added 2026-08-23; was 169 before the
#                         five silent failures (section 6) and the three
#                         fresh-router sections (7-9) landed, floor 160 ->
#                         395)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14" # matches local dev; the Dockerfile floats `npm i -g bun`

      - name: Install
        run: bun install --frozen-lockfile

      # 751 files, currently 0 errors. This is the cheapest gate here and
      # the one most likely to catch a real break, so it runs first.
      - name: tsc --noEmit
        run: bunx tsc --noEmit

      # eslint exits non-zero on errors by itself. --max-warnings pins the
      # warning count as a RATCHET: the repo was just cleaned to 56
      # warnings, and this stops it drifting back up without anyone
      # deciding to let it. Lower the number as warnings get fixed; raising
      # it should require saying why in the PR.
      #
      # `.claude` is ignored in eslint.config.js -- without that ignore
      # eslint walked 45,184 files of stale agent worktrees. If this step
      # ever starts taking minutes instead of seconds, that ignore has
      # been lost.
      - name: eslint
        run: bunx eslint . --max-warnings 56

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14" # matches local dev; the Dockerfile floats `npm i -g bun`

      - name: Install
        run: bun install --frozen-lockfile

      # Build under the SAME nitro preset the Dockerfile pins. Without
      # NITRO_PRESET the @lovable.dev config defaults to
      # "cloudflare-module", which produces a Worker bundle that
      # `node .output/server/index.mjs` cannot run -- so a CI build without
      # this would be green while the image is broken.
      - name: vite build
        env:
          NODE_ENV: production
          NITRO_PRESET: node-server
          # Deliberately the relative fallback, not a real hostname. This
          # job proves the bundle COMPILES; it is not the artifact that
          # ships. The image is built separately with the real
          # VITE_API_BASE_URL baked in, because vite inlines it.
          VITE_API_BASE_URL: /api/v1
        run: bun run build

      - name: Assert the server bundle exists
        run: |
          test -f .output/server/index.mjs \
            || { echo "no .output/server/index.mjs -- wrong nitro preset?"; exit 1; }
          echo "server bundle: $(du -h .output/server/index.mjs | cut -f1)"

  tests:
    name: Portal regression suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14" # matches local dev; the Dockerfile floats `npm i -g bun`

      - name: Install
        run: bun install --frozen-lockfile

      # test-portal-signin-fields.mjs drives a real Chromium through
      # playwright. Without this step it fails at chromium.launch().
      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium

      # Each suite runs through ci-gated-test.sh, which requires exit 0
      # AND the suite's own success sentinel AND a floor on the number of
      # checks that actually ran. See that script's header for why the
      # exit code alone is not enough.
      #
      # The floors are the counts observed green on 2026-08-22. Raise them
      # when you add checks.

      # THE ONE THAT ALREADY BROKE. This is the regression test for the
      # confirmed-live "OTP verifies but no real internet" incident, and it
      # was silently erroring out on origin/main because portal.success.tsx
      # gained an import its esbuild stub did not export. Nothing ran it,
      # so nobody found out.
      - name: portal CNA storage safety
        run: |
          ./scripts/ci-gated-test.sh \
            "portal-cna-storage-safety" 7 "all checks passed" \
            bun run test:portal-cna

      - name: portal sign-in fields
        run: |
          ./scripts/ci-gated-test.sh \
            "portal-signin-fields" 23 \
            "Sign-in field regression test: all checks passed." \
            bun run test:signin-fields

      - name: firewall rule ordering
        run: |
          ./scripts/ci-gated-test.sh \
            "fw-rule-order" 7 "fw-rule-order: all checks passed" \
            bun run test:fw-order

      # THE SAFETY-CRITICAL ONE. This suite decides whether a pasted
      # router output means PASS or FAIL, so every wrong answer it can
      # give ships a broken router or resets a healthy one. tsc cannot see
      # any of it -- it is a text parser over device output, where every
      # type is `string` and every bug is in what the strings mean.
      #
      # The floor is high on purpose. The fixtures are real RouterOS
      # shapes (v6 and v7, `print` and `print detail`) for each way this
      # fleet has actually broken, and losing them quietly is exactly the
      # coverage-shrink failure ci-gated-test.sh exists to catch.
      - name: guided-setup output analyser
        run: |
          ./scripts/ci-gated-test.sh \
            "output-analyser" 116 "output-analyser: all checks passed" \
            bun run test:output-analyser

      # --- Guided Setup i18n (Hinglish / English / Devanagari) -----------
      #
      # Floors here scale with CONTENT: the number of phases, checks and
      # diagnostics symptoms in phases.content.ts / diagnostics.content.ts.
      # A small drop when a content author legitimately removes a check is
      # expected; a large one means assertions disappeared. Set a little
      # below the observed count for that reason, rather than pinned exactly.
      - name: guided setup i18n invariants
        run: |
          ./scripts/ci-gated-test.sh \
            "guided-i18n" 5400 "guided-i18n: all checks passed" \
            bun run test:guided-i18n

      - name: guided setup i18n state preservation
        run: |
          ./scripts/ci-gated-test.sh \
            "guided-i18n-state" 210 "guided-i18n-state: all checks passed" \
            bun run test:guided-i18n-state

      # Uses the Chromium installed above for test:signin-fields, so it
      # adds no new CI infrastructure. It is the only thing that can prove
      # the requirement it exists for: switching language must not REMOUNT
      # the module and throw away router output the operator has pasted.
      # Verified to fail on purpose by keying <CheckRow> on a translated
      # string; see the script header.
      - name: guided setup language switch
        run: |
          ./scripts/ci-gated-test.sh \
            "guided-i18n-switch" 28 \
            "Guided Setup language switch: all checks passed." \
            bun run test:guided-i18n-switch

      # --- Manual wizard engine -----------------------------------------
      #
      # The engine that turns a pasted RouterOS output into a verdict. Its
      # floor is high for the same reason the analyser's is: every section
      # of the suite injects a real violation (`Is` for `As`, a paste cut
      # mid-table, `/interface print` where a DHCP probe was asked for, one
      # RADIUS counter reading, four zero counters, `gateway=0.0.0.0`) and
      # asserts the guard fires. Each of those guards was verified to FAIL
      # the suite when mutated -- 15 of 15 mutations caught, recorded in the
      # script header. Losing them quietly is the exact coverage-shrink
      # failure ci-gated-test.sh exists to catch.
      - name: manual wizard engine
        run: |
          ./scripts/ci-gated-test.sh \
            "manual-wizard-engine" 100 \
            "manual-wizard-engine: all checks passed" \
            bun run test:manual-wizard

      # --- Edit Plan dialog ---------------------------------------------
      #
      # Regression test for a confirmed-live "it doesn't work and it won't
      # go away" report against the master console's Edit Plan dialog.
      # Three defects produced that one symptom and NONE was visible to
      # tsc, eslint or the build: the browser's own constraint validation
      # suppressed the submit event entirely for a plan whose limit was 0
      # (measured: 0 submit events, so no React, no zod, no request, no
      # message); twelve of thirteen fields had nowhere to render a
      # validation message; and save.mutate had no onError, so a rejected
      # save left the dialog waiting forever on a success that never came.
      #
      # Reuses the Chromium installed above, so it adds no CI
      # infrastructure. All three defects were verified to FAIL this suite
      # when reintroduced (9, 2 and 4 checks red respectively).
      - name: edit plan dialog feedback
        run: |
          ./scripts/ci-gated-test.sh \
            "plan-editor-feedback" 33 \
            "plan-editor-feedback: all checks passed" \
            bun run test:plan-editor

      # --- MikroTik setup-script generator ------------------------------
      #
      # The text a technician pastes into a real router. tsc cannot see a
      # single defect in it: every value is a `string` and every bug is in
      # what the string MEANS to RouterOS.
      #
      # It gates two confirmed-live defect classes over the generator's
      # whole option matrix (each WAN mode, 1/2/3 WANs, both routing modes,
      # basicConfigOnly, every optional subsystem):
      #   - a `:local` read on a later line than the one that bound it.
      #     The RouterOS console runs each entered line as its own program,
      #     so those lines are a syntax error -- and a block that computes
      #     its verdict from such a variable prints a confident wrong
      #     answer. Same defect as PRs #125/#126 fixed in the two sibling
      #     modules; it was present in 12 of this generator's chunk kinds.
      #   - a multi-statement `do={}` body, which threw a real syntax error
      #     on a live router at the boundary between the two statements.
      #
      # It also gates the three defects that hit a FRESH router
      # specifically (added 2026-08-23), none of which the two guards above
      # could see, because each one is about something the script never
      # said at all:
      #   - the generator never set the clock. No battery-backed RTC means
      #     a wrong date on every boot, a wrong date fails HTTPS cert
      #     validation, the heartbeat is rejected before it is sent, and
      #     the router shows offline forever while guests get working WiFi.
      #     Gated on the chunk existing, on it landing BEFORE every
      #     `/tool fetch url=`, on the NTP servers being raw IPs (a name
      #     cannot be resolved by a router whose DNS is broken), and on it
      #     VERIFYING the sync rather than assuming it.
      #   - a peer whose `endpoint-address` was set from a hostname the
      #     device could not resolve. RouterOS resolves it once, at
      #     creation, and never again; the `add` succeeds and nothing
      #     reports it. Gated on the `:resolve` check, on the add being
      #     conditional on it, and on the dead hub literal 20.219.72.235
      #     never appearing in any generated script.
      #   - the Master-console panel's "what a re-Generate breaks" table,
      #     asserted against what the chunks really emit. A warning nothing
      #     checks is how it quietly becomes a lie.
      #
      # Six mutations of the real generator and three of the guards
      # themselves were verified to fail this suite; see the script header
      # for the table.
      #
      # Section 6 (the five silent failures: discovered portal-file paths,
      # the removed local-hotspot-user bypass, a real idle-timeout, the WAN
      # check ordered after DNS, and one tunnel interface name matching the
      # backend) adds 53 checks and 15 more verified mutations. Sections
      # 7-9 (the three fresh-router traps described above) add sixteen more
      # verified mutations of their own. 31 mutations in total across the
      # three tables, all caught.
      #
      # Section 10 (added 2026-08-23) covers the OTHER state a MikroTik
      # hardware reset can leave the device in: no default configuration at
      # all. No bridge, no `WAN`/`LAN` interface lists, no defconf firewall
      # rules, no DHCP client -- every chunk here had only ever been run
      # against the state where all of that exists. Most of the generator
      # already coped, and the section says so; what it found was one L2
      # hole and six chunks that did their work silently.
      #
      # The hole: for a PPPoE WAN only the VIRTUAL
      # `cloudguest-pppoe-wan<N>` interface goes into the "WAN" list, so
      # the PHYSICAL port carrying the session tests as "not a WAN port" in
      # the LAN sweep. MikroTik's own defconf `ether1 -> WAN` membership was
      # what kept it out of the guest bridge; without defaults nothing does,
      # and the live uplink gets bridged into the guest LAN. Gated on the
      # live `/interface pppoe-client` exclusion being present in BOTH sweep
      # passes and on it being read from the device rather than hardcoded.
      #
      # The six: WAN + Bridge, the stale-defconf cleanup, LAN Ports, the
      # Hotspot chunk, the self-signed certificate chunk and RADIUS each
      # now bind a count, print it, and take a named FAIL branch on zero --
      # because `set [find ...]` against an empty match SUCCEEDS on
      # RouterOS and an empty `:foreach` exits clean, so a chunk could run
      # perfectly on a bare router and configure nothing. Also gated: no
      # `place-before` may target anything but a variable bound and
      # length-checked on its own line, every emitted `add` must carry an
      # existence test, and no chunk may key on `defconf` or `bridgeLocal`
      # outside the one cleanup chunk whose job that is.
      #
      # Twenty mutations of the generator and four of the guards themselves
      # were verified to fail this suite; see the script header. Two of
      # those four were real holes it found (a self-check testing its own
      # private copy of the regex the sweep used), not confirmations.
      #
      # Section 11 (added 2026-08-23) is a whole-script RouterOS syntax QA
      # pass, prompted by a live failure: the founder pasted the WAN
      # Routing chunk into a real hEX and the console answered `error`.
      #
      # A concatenation used as a command ARGUMENT must be parenthesised.
      # This shipped without them:
      #   :log warning "cloudguest: WAN1 gateway ... \"" . $wan1Gw . "\" ..."
      # RouterOS reads `:log warning "<string>"` as a complete command and
      # then meets `. $wan1Gw . "..."` as a second, meaningless one. It is a
      # hard syntax error, and because a chunk is `;`-joined onto ONE
      # entered line it aborted the WHOLE line -- the gateway poll, the
      # plain default route and every routing-mark'd route never ran, so
      # the router was left with no default route at all. Sections 1 and 2
      # were both blind to it: no variable crosses a line and the `do={}`
      # body holds one statement. Malformed argument syntax is a third
      # thing, and it is now swept for across every emitted line.
      #
      # Three more whole-script properties are budgeted here, because each
      # is a real constraint that nothing was measuring: every `/...`
      # command path must be a known RouterOS menu (a `/ip pppoe-client`
      # for `/interface pppoe-client` typo is invisible otherwise -- on a
      # `find` it matches nothing forever and every `set` against it
      # succeeds); no emitted line may exceed 3300 chars (WinBox mangles
      # long pastes, which is why this generator chunks at all -- the
      # longest today is 3125, in the very chunk that just failed); and no
      # chunk may block the console for more than 60s (the DHCP-gateway and
      # NTP polls block on purpose, and a technician reads a frozen
      # terminal as a hang and power-cycles mid-provision -- two WANs
      # already reach 50s).
      #
      # Eleven mutations were injected and this suite re-run, all caught.
      # Two of them were real holes in the new guards rather than
      # confirmations -- the same "self-check exercises a different code
      # path than the sweep" shape section 10 was caught by twice, plus an
      # anti-over-strictness check whose sample string did not actually
      # contain the pattern it claimed to. Predicates are shared between
      # sweep and self-check throughout.
      #
      # The two floors sections 6-9 were developed against (210 and 340)
      # were raised on separate branches and merged here; neither survives
      # on its own, because the sections are disjoint and the suite now runs
      # both. Floor raised 160 -> 395 -> 435 -> 450, observed green at
      # 469 on 2026-08-23.
      - name: setup script generator
        run: |
          ./scripts/ci-gated-test.sh \
            "setup-script-generator" 450 \
            "setup-script-generator: all checks passed" \
            bun run test:setup-script

      # This one prints only a verdict line, no per-check output, so its
      # floor is 0 and the sentinel is doing all the work.
      - name: portal a11y invariants
        run: |
          ./scripts/ci-gated-test.sh \
            "a11y-invariants" 0 \
            "Portal accessibility invariants: all checks passed." \
            bun run test:a11y
