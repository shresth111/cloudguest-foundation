name: CI

# The frontend has had no CI at all. The Dockerfile's builder stage runs
# `bun run build` and nothing else -- no tsc, no eslint, no tests -- so
# every gate below is currently enforced only by whoever remembers to run
# it locally.
#
# Everything here is verified green on `feat/guided-setup-and-provisioning-fixes`
# as of 2026-08-22, so this starts life passing and any red is a real
# regression:
#   tsc --noEmit ........ 0 errors across 751 files
#   eslint . ............ 0 errors, 56 warnings
#   test:portal-cna ..... 7 checks
#   test:signin-fields .. 23 checks
#   test:fw-order ....... 7 checks
#   test:output-analyser  116 checks
#   test:a11y ........... sentinel only
#   test:manual-wizard .. 113 checks
#   test:setup-script ... 3279 checks, all green (was 3081; sections 15.1b
#                         and 16 -- the /import `:put` hedge and the typed
#                         acknowledgement on a partial provision -- landed
#                         2026-09-02, floor 3070 -> 3265; was 2000; section 15 --
#                         the .rsc delivery channel -- landed 2026-09-02
#                         with 122 deliberately RED, and the generator fix
#                         in the same PR turned every one of them green;
#                         sections 15.9 and 15.10 were then added by the
#                         integration to cover the two behaviours the fix
#                         introduced and nothing tested: the COMPLETE
#                         sentinel on a partial run, and which of the three
#                         kinds of gap is allowed to abort an /import).
#                         And 169 before the
#                         five silent failures (section 6) and the three
#                         fresh-router sections (7-9) landed, floor 160 ->
#                         395 -> 435 -> 450; then section 12, "the uplink is
#                         discovered not assumed", plus seven WAN interface
#                         shapes added to the variant sweep, 469 -> 1453;
#                         then section 13, the seven field defects of
#                         2026-08-23 plus six non-/24 LAN variants in the
#                         main sweep, 1453 -> 2000, floor 1400 -> 1950)
#   test:api-paths            5 checks -- the Fleet Wizard's WAN endpoint
#                             404'd from the day it shipped because the
#                             frontend path was missing the backend
#                             router's /network-config prefix, and the
#                             docs recorded it without the prefix too
#   test:voucher-walkthrough  51 checks (added 2026-09-02 -- the guest
#                         walkthrough's voucher step, and the real voucher
#                         sign-in it must leave alone)
#   test:post-login-roundtrip 21 checks -- gated in the Jenkinsfile from the
#                         day it shipped and in NO GitHub Actions step, i.e.
#                         on nothing that can block a merge, until 2026-09-02
#   test:post-login-sandbox   9 checks (same story; drives real Chromium)
#   test:location-liveness    105 checks (in package.json since it was
#                         written, gated nowhere until 2026-09-02 -- the
#                         same "nothing runs it" state as the two below)
#   test:discovery-preflight  19 checks (in package.json since 2026-08-22
#                         but gated nowhere until 2026-08-23 -- it has been
#                         passing this whole time and proving nothing,
#                         which is the same "nothing runs it" state that
#                         let test:portal-cna rot on origin/main)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # cd.yml calls this instead of restating tsc, eslint and the eleven
  # ci-gated-test.sh suites. The gates stay defined once, here, and a deploy
  # cannot pass a version of them that has drifted from the one PRs run.
  workflow_call:

# github.workflow is the TOP-LEVEL caller's name, so a direct CI run groups
# under "CI-..." and the copy cd.yml calls groups under "CD-...". Without that
# discriminator a push to main starts both, they land in the same group, and
# cancel-in-progress makes them cancel each other -- which looks exactly like
# a flaky CI failure and is not one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14" # matches local dev; the Dockerfile floats `npm i -g bun`

      - name: Install
        run: bun install --frozen-lockfile

      # 751 files, currently 0 errors. This is the cheapest gate here and
      # the one most likely to catch a real break, so it runs first.
      - name: tsc --noEmit
        run: bunx tsc --noEmit

      # eslint exits non-zero on errors by itself. --max-warnings pins the
      # warning count as a RATCHET: the repo was just cleaned to 56
      # warnings, and this stops it drifting back up without anyone
      # deciding to let it. Lower the number as warnings get fixed; raising
      # it should require saying why in the PR.
      #
      # `.claude` is ignored in eslint.config.js -- without that ignore
      # eslint walked 45,184 files of stale agent worktrees. If this step
      # ever starts taking minutes instead of seconds, that ignore has
      # been lost.
      - name: eslint
        run: bunx eslint . --max-warnings 56

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14" # matches local dev; the Dockerfile floats `npm i -g bun`

      - name: Install
        run: bun install --frozen-lockfile

      # Build under the SAME nitro preset the Dockerfile pins. Without
      # NITRO_PRESET the @lovable.dev config defaults to
      # "cloudflare-module", which produces a Worker bundle that
      # `node .output/server/index.mjs` cannot run -- so a CI build without
      # this would be green while the image is broken.
      - name: vite build
        env:
          NODE_ENV: production
          NITRO_PRESET: node-server
          # Deliberately the relative fallback, not a real hostname. This
          # job proves the bundle COMPILES; it is not the artifact that
          # ships. The image is built separately with the real
          # VITE_API_BASE_URL baked in, because vite inlines it.
          VITE_API_BASE_URL: /api/v1
        run: bun run build

      - name: Assert the server bundle exists
        run: |
          test -f .output/server/index.mjs \
            || { echo "no .output/server/index.mjs -- wrong nitro preset?"; exit 1; }
          echo "server bundle: $(du -h .output/server/index.mjs | cut -f1)"

  tests:
    name: Portal regression suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14" # matches local dev; the Dockerfile floats `npm i -g bun`

      - name: Install
        run: bun install --frozen-lockfile

      # test-portal-signin-fields.mjs drives a real Chromium through
      # playwright. Without this step it fails at chromium.launch().
      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium

      # Each suite runs through ci-gated-test.sh, which requires exit 0
      # AND the suite's own success sentinel AND a floor on the number of
      # checks that actually ran. See that script's header for why the
      # exit code alone is not enough.
      #
      # The floors are the counts observed green on 2026-08-22. Raise them
      # when you add checks.

      # THE ONE THAT ALREADY BROKE. This is the regression test for the
      # confirmed-live "OTP verifies but no real internet" incident, and it
      # was silently erroring out on origin/main because portal.success.tsx
      # gained an import its esbuild stub did not export. Nothing ran it,
      # so nobody found out.
      - name: portal CNA storage safety
        run: |
          ./scripts/ci-gated-test.sh \
            "portal-cna-storage-safety" 7 "all checks passed" \
            bun run test:portal-cna

      - name: portal sign-in fields
        run: |
          ./scripts/ci-gated-test.sh \
            "portal-signin-fields" 23 \
            "Sign-in field regression test: all checks passed." \
            bun run test:signin-fields

      - name: firewall rule ordering
        run: |
          ./scripts/ci-gated-test.sh \
            "fw-rule-order" 7 "fw-rule-order: all checks passed" \
            bun run test:fw-order

      # THE SAFETY-CRITICAL ONE. This suite decides whether a pasted
      # router output means PASS or FAIL, so every wrong answer it can
      # give ships a broken router or resets a healthy one. tsc cannot see
      # any of it -- it is a text parser over device output, where every
      # type is `string` and every bug is in what the strings mean.
      #
      # The floor is high on purpose. The fixtures are real RouterOS
      # shapes (v6 and v7, `print` and `print detail`) for each way this
      # fleet has actually broken, and losing them quietly is exactly the
      # coverage-shrink failure ci-gated-test.sh exists to catch.
      - name: guided-setup output analyser
        run: |
          ./scripts/ci-gated-test.sh \
            "output-analyser" 116 "output-analyser: all checks passed" \
            bun run test:output-analyser

      # --- Guided Setup i18n (Hinglish / English / Devanagari) -----------
      #
      # Floors here scale with CONTENT: the number of phases, checks and
      # diagnostics symptoms in phases.content.ts / diagnostics.content.ts.
      # A small drop when a content author legitimately removes a check is
      # expected; a large one means assertions disappeared. Set a little
      # below the observed count for that reason, rather than pinned exactly.
      - name: guided setup i18n invariants
        run: |
          ./scripts/ci-gated-test.sh \
            "guided-i18n" 5400 "guided-i18n: all checks passed" \
            bun run test:guided-i18n

      - name: guided setup i18n state preservation
        run: |
          ./scripts/ci-gated-test.sh \
            "guided-i18n-state" 210 "guided-i18n-state: all checks passed" \
            bun run test:guided-i18n-state

      # Uses the Chromium installed above for test:signin-fields, so it
      # adds no new CI infrastructure. It is the only thing that can prove
      # the requirement it exists for: switching language must not REMOUNT
      # the module and throw away router output the operator has pasted.
      # Verified to fail on purpose by keying <CheckRow> on a translated
      # string; see the script header.
      - name: guided setup language switch
        run: |
          ./scripts/ci-gated-test.sh \
            "guided-i18n-switch" 28 \
            "Guided Setup language switch: all checks passed." \
            bun run test:guided-i18n-switch

      # --- Manual wizard engine -----------------------------------------
      #
      # The engine that turns a pasted RouterOS output into a verdict. Its
      # floor is high for the same reason the analyser's is: every section
      # of the suite injects a real violation (`Is` for `As`, a paste cut
      # mid-table, `/interface print` where a DHCP probe was asked for, one
      # RADIUS counter reading, four zero counters, `gateway=0.0.0.0`) and
      # asserts the guard fires. Each of those guards was verified to FAIL
      # the suite when mutated -- 15 of 15 mutations caught, recorded in the
      # script header. Losing them quietly is the exact coverage-shrink
      # failure ci-gated-test.sh exists to catch.
      - name: manual wizard engine
        run: |
          ./scripts/ci-gated-test.sh \
            "manual-wizard-engine" 100 \
            "manual-wizard-engine: all checks passed" \
            bun run test:manual-wizard

      # --- Edit Plan dialog ---------------------------------------------
      #
      # Regression test for a confirmed-live "it doesn't work and it won't
      # go away" report against the master console's Edit Plan dialog.
      # Three defects produced that one symptom and NONE was visible to
      # tsc, eslint or the build: the browser's own constraint validation
      # suppressed the submit event entirely for a plan whose limit was 0
      # (measured: 0 submit events, so no React, no zod, no request, no
      # message); twelve of thirteen fields had nowhere to render a
      # validation message; and save.mutate had no onError, so a rejected
      # save left the dialog waiting forever on a success that never came.
      #
      # Reuses the Chromium installed above, so it adds no CI
      # infrastructure. All three defects were verified to FAIL this suite
      # when reintroduced (9, 2 and 4 checks red respectively).
      - name: edit plan dialog feedback
        run: |
          ./scripts/ci-gated-test.sh \
            "plan-editor-feedback" 33 \
            "plan-editor-feedback: all checks passed" \
            bun run test:plan-editor

      # --- MikroTik setup-script generator ------------------------------
      #
      # The text a technician pastes into a real router. tsc cannot see a
      # single defect in it: every value is a `string` and every bug is in
      # what the string MEANS to RouterOS.
      #
      # It gates two confirmed-live defect classes over the generator's
      # whole option matrix (each WAN mode, 1/2/3 WANs, both routing modes,
      # basicConfigOnly, every optional subsystem):
      #   - a `:local` read on a later line than the one that bound it.
      #     The RouterOS console runs each entered line as its own program,
      #     so those lines are a syntax error -- and a block that computes
      #     its verdict from such a variable prints a confident wrong
      #     answer. Same defect as PRs #125/#126 fixed in the two sibling
      #     modules; it was present in 12 of this generator's chunk kinds.
      #   - a multi-statement `do={}` body, which threw a real syntax error
      #     on a live router at the boundary between the two statements.
      #
      # It also gates the three defects that hit a FRESH router
      # specifically (added 2026-08-23), none of which the two guards above
      # could see, because each one is about something the script never
      # said at all:
      #   - the generator never set the clock. No battery-backed RTC means
      #     a wrong date on every boot, a wrong date fails HTTPS cert
      #     validation, the heartbeat is rejected before it is sent, and
      #     the router shows offline forever while guests get working WiFi.
      #     Gated on the chunk existing, on it landing BEFORE every
      #     `/tool fetch url=`, on the NTP servers being raw IPs (a name
      #     cannot be resolved by a router whose DNS is broken), and on it
      #     VERIFYING the sync rather than assuming it.
      #   - a peer whose `endpoint-address` was set from a hostname the
      #     device could not resolve. RouterOS resolves it once, at
      #     creation, and never again; the `add` succeeds and nothing
      #     reports it. Gated on the `:resolve` check, on the add being
      #     conditional on it, and on the dead hub literal 20.219.72.235
      #     never appearing in any generated script.
      #   - the Master-console panel's "what a re-Generate breaks" table,
      #     asserted against what the chunks really emit. A warning nothing
      #     checks is how it quietly becomes a lie.
      #
      # Six mutations of the real generator and three of the guards
      # themselves were verified to fail this suite; see the script header
      # for the table.
      #
      # Section 6 (the five silent failures: discovered portal-file paths,
      # the removed local-hotspot-user bypass, a real idle-timeout, the WAN
      # check ordered after DNS, and one tunnel interface name matching the
      # backend) adds 53 checks and 15 more verified mutations. Sections
      # 7-9 (the three fresh-router traps described above) add sixteen more
      # verified mutations of their own. 31 mutations in total across the
      # three tables, all caught.
      #
      # Section 10 (added 2026-08-23) covers the OTHER state a MikroTik
      # hardware reset can leave the device in: no default configuration at
      # all. No bridge, no `WAN`/`LAN` interface lists, no defconf firewall
      # rules, no DHCP client -- every chunk here had only ever been run
      # against the state where all of that exists. Most of the generator
      # already coped, and the section says so; what it found was one L2
      # hole and six chunks that did their work silently.
      #
      # The hole: for a PPPoE WAN only the VIRTUAL
      # `cloudguest-pppoe-wan<N>` interface goes into the "WAN" list, so
      # the PHYSICAL port carrying the session tests as "not a WAN port" in
      # the LAN sweep. MikroTik's own defconf `ether1 -> WAN` membership was
      # what kept it out of the guest bridge; without defaults nothing does,
      # and the live uplink gets bridged into the guest LAN. Gated on the
      # live `/interface pppoe-client` exclusion being present in BOTH sweep
      # passes and on it being read from the device rather than hardcoded.
      #
      # The six: WAN + Bridge, the stale-defconf cleanup, LAN Ports, the
      # Hotspot chunk, the self-signed certificate chunk and RADIUS each
      # now bind a count, print it, and take a named FAIL branch on zero --
      # because `set [find ...]` against an empty match SUCCEEDS on
      # RouterOS and an empty `:foreach` exits clean, so a chunk could run
      # perfectly on a bare router and configure nothing. Also gated: no
      # `place-before` may target anything but a variable bound and
      # length-checked on its own line, every emitted `add` must carry an
      # existence test, and no chunk may key on `defconf` or `bridgeLocal`
      # outside the one cleanup chunk whose job that is.
      #
      # Twenty mutations of the generator and four of the guards themselves
      # were verified to fail this suite; see the script header. Two of
      # those four were real holes it found (a self-check testing its own
      # private copy of the regex the sweep used), not confirmations.
      #
      # Section 11 (added 2026-08-23) is a whole-script RouterOS syntax QA
      # pass, prompted by a live failure: the founder pasted the WAN
      # Routing chunk into a real hEX and the console answered `error`.
      #
      # A concatenation used as a command ARGUMENT must be parenthesised.
      # This shipped without them:
      #   :log warning "cloudguest: WAN1 gateway ... \"" . $wan1Gw . "\" ..."
      # RouterOS reads `:log warning "<string>"` as a complete command and
      # then meets `. $wan1Gw . "..."` as a second, meaningless one. It is a
      # hard syntax error, and because a chunk is `;`-joined onto ONE
      # entered line it aborted the WHOLE line -- the gateway poll, the
      # plain default route and every routing-mark'd route never ran, so
      # the router was left with no default route at all. Sections 1 and 2
      # were both blind to it: no variable crosses a line and the `do={}`
      # body holds one statement. Malformed argument syntax is a third
      # thing, and it is now swept for across every emitted line.
      #
      # Three more whole-script properties are budgeted here, because each
      # is a real constraint that nothing was measuring: every `/...`
      # command path must be a known RouterOS menu (a `/ip pppoe-client`
      # for `/interface pppoe-client` typo is invisible otherwise -- on a
      # `find` it matches nothing forever and every `set` against it
      # succeeds); no emitted line may exceed 3300 chars (WinBox mangles
      # long pastes, which is why this generator chunks at all -- the
      # longest today is 3125, in the very chunk that just failed); and no
      # chunk may block the console for more than 60s (the DHCP-gateway and
      # NTP polls block on purpose, and a technician reads a frozen
      # terminal as a hang and power-cycles mid-provision -- two WANs
      # already reach 50s).
      #
      # Eleven mutations were injected and this suite re-run, all caught.
      # Two of them were real holes in the new guards rather than
      # confirmations -- the same "self-check exercises a different code
      # path than the sweep" shape section 10 was caught by twice, plus an
      # anti-over-strictness check whose sample string did not actually
      # contain the pattern it claimed to. Predicates are shared between
      # sweep and self-check throughout.
      #
      # The two floors sections 6-9 were developed against (210 and 340)
      # were raised on separate branches and merged here; neither survives
      # on its own, because the sections are disjoint and the suite now runs
      # both. Floor raised 160 -> 395 -> 435 -> 450 -> 1400 -> 1530,
      # observed green at 1588 on 2026-08-23. The 1530 step is sections 13
      # and 14: one writer per hotspot-profile property with no
      # router-signed TLS in front of a guest (13), and intercept-the-probe
      # -never-allow-it for OS captive-portal detection (14). It also
      # retires the three checks that counted the deleted self-signed
      # certificate chunk and replaces them with three over the login-by
      # read-back that took its place. The earlier jump is section 12 -- every
      # default-route lookup in every chunk rather than the heartbeat's
      # alone, the RouterOS 7 `routing-table=` vocabulary that replaced a
      # v6 spelling which matched nothing without erroring, the failover
      # sequence run end to end against the emitted selector, and the
      # router-originated-traffic policy -- plus seven new WAN interface
      # shapes in the variant sweep, which every earlier section also
      # runs against.
      #
      # SECTION 13 (2026-08-23) adds the seven defects found provisioning
      # real MikroTiks that day, plus the two reporting failures that made
      # the worst of them survivable for days:
      #   - the DHCP pool and network entry were built from the first three
      #     octets of the LAN IP and ignored the prefix, so a /25 handed
      #     guests .128-.254 -- a lease, no route to their own gateway, no
      #     login page -- and the chunk printed RESULT: PASS. Gated on
      #     containment recomputed by INDEPENDENT arithmetic in the suite
      #     (not by the function under test, which would agree with its own
      #     bug), on every prefix /1../30, and on the verdict reading the
      #     pool's ranges back off the device rather than asking only
      #     whether five objects exist.
      #   - re-pasting the mangle chunk re-appended the PCC rules BELOW the
      #     mark-routing rules, so the SYN of each new connection was still
      #     no-mark at the routing decision and left by the wrong WAN.
      #     Gated on the sweep covering the whole cloudguest-mangle- family
      #     in both the weighted and even-split paths, and on every
      #     mark-routing add being emitted below every mark-connection add.
      #   - failover_only deleted the marked routes and never swept the
      #     marks, leaving traffic marked for a routing table with no
      #     routes in it.
      #   - the RADIUS else-branch never wrote `secret=`, so rotating the
      #     shared secret and re-pasting left the router on the old one and
      #     every guest login Access-Rejected. The chunk and
      #     SECRET_REPAIR.radius.repairableByRepaste are asserted together,
      #     in both directions, so neither can move alone.
      #   - only `dynamic=yes` addresses were swept, so a stale STATIC WAN
      #     address survived every re-paste.
      #   - the LAN port allowlist reused the WAN existence-check copy
      #     verbatim and named the wrong side of the router.
      #   - the hotspot `dns-name` set was a bare `set [find ...]`, which
      #     succeeds silently against an empty match.
      #   - the one-line copy is all-or-nothing: RouterOS aborts the
      #     remainder of a line at the first error and reports one message
      #     with no indication of how far it got. That is how a router
      #     served guests perfectly while showing offline for days -- the
      #     Heartbeat chunk never ran. Gated on a START/DONE marker per
      #     chunk and a final COMPLETE marker.
      #   - and the validator that passed the line which caused it. It
      #     checked bracket/quote BALANCE and presented that as VALIDITY.
      #     Gated on it rejecting the exact line that aborted the live
      #     paste, on it NOT flagging the parenthesised form (over-
      #     strictness gets a validator clicked past, which is how it ends
      #     up trusted for the wrong question), on it reporting nothing
      #     against any script this generator really emits, and on the
      #     panel rendering the validator's own published scope rather than
      #     a hand-written claim that can go stale.
      #
      # Every guard in section 13 has a paired INJECTED check that
      # reintroduces the defect and asserts the guard fires, plus an
      # anti-over-strictness check that the shipped shape is NOT flagged.
      # Nine source-level mutations were injected into the real generator
      # and validator and this suite re-run; all nine were caught. See the
      # script header.
      #
      # Floor raised 1400 -> 1950, observed green at 2000 on 2026-08-23.
      # Six non-/24 LAN variants were added to the MAIN sweep (a /25 with
      # the router in each half, /23, /28, /26 with a LAN allowlist, and a
      # /31 that cannot hold a pool at all), so every earlier section runs
      # against them too -- that is most of the jump.
      #
      # SECTION 15 (2026-09-02) -- THE .rsc IS A DELIVERY CHANNEL, NOT A
      # VIEW. Added after the same report for the FIFTH time: "a problem I
      # have had fixed many times already -- I configured using the .rsc
      # file, the script executed, RADIUS wasn't there and it didn't run."
      #
      # Sections 1-14 all assert over `chunk.script`. The DOWNLOADED FILE,
      # which is how the founder provisions, had four checks against it,
      # all about one header. The channel with the most reported failures
      # had the least coverage, and every whole-script guard in the suite
      # was transferring to it by assumption.
      #
      # 602 checks were added, 122 of them RED against origin/main at
      # f99c02b. Each red one was a finding, not a broken test, and the
      # generator work in this same PR closed all 122:
      #
      #   115  the .rsc carried NO progress markers. Measured: 65 in
      #        `chunksToSingleLineScript`'s output and 0 in
      #        `chunksToRouterOsScript`'s, for the same script. /import
      #        aborts at the first error and reports ONE message with no
      #        indication of how far it got -- which is exactly what
      #        section 13 fixed for the one-line paste and never fixed
      #        here. It is why four separate fixes each addressed
      #        whichever statement happened to be found: the operator
      #        could report THAT it stopped and never WHERE.
      #     5  a default Generate silently omitted whole subsystems.
      #        `enableWireguard` and `enableRadius` both defaulted to false
      #        and `notProvisioned` -- the array driving the loud
      #        INCOMPLETE SCRIPT chunk and its :error -- was appended only
      #        from catch blocks. An unticked checkbox is not a caught
      #        error, so the script emitted 28 chunks instead of 32,
      #        imported perfectly, printed RESULT: PASS everywhere, created
      #        the heartbeat scheduler so the router showed GREEN in Master
      #        console -- and /radius was empty. 15.8 now requires the gap
      #        to be DERIVED from `opts` inside the generator, so a caller
      #        that forgets cannot reproduce it.
      #     2  an :error above the RADIUS chunk stops the whole /import,
      #        and every one of those messages was written for someone
      #        pasting chunk by chunk ("re-run", "re-paste just this
      #        chunk"). In a file there are no chunks on screen.
      #
      # ADDED BY THE INTEGRATION, covering behaviour the fix introduced
      # that nothing asserted (both were confirmed to fail against the fix
      # branch before the code that satisfies them was written):
      #
      #   15.9   a DELIBERATE gap does not :error -- by design -- so it
      #          runs to the end and printed the same "COMPLETE -- all N
      #          chunk(s) ran" a full provision does. The field runbook is
      #          "import it, read the last line"; that line now names the
      #          gap, in both channels, from one shared builder.
      #   15.10  the three endings (chose it / it failed / nobody said and
      #          the generator derived it) are a product decision and none
      #          of them was pinned. Six mutations of the generator were
      #          injected against them; all six caught.
      #
      # Seventeen mutations of the real generator were injected before
      # landing and the suite re-run; all seventeen caught. FOUR survived
      # the first pass and all four were real holes in the NEW guards
      # rather than confirmations -- the sixth time that shape has been
      # caught in this file. See the script header for the table and for
      # the three pre-existing checks section 15 corrected (13.10's
      # "complete" fixture was a script missing three subsystems, its
      # log-line count was graded against the caller's list rather than the
      # emitted one, and an INJECTED check matched `COMPLETE` as a
      # substring of `INCOMPLETE`).
      #
      # SECTION 15.1b AND SECTION 16 (2026-09-02) -- THE TWO RESIDUAL
      # RISKS LEFT OPEN WHEN SECTION 15 LANDED.
      #
      #  1. THE MARKERS RESTED ON AN UNMEASURED ASSUMPTION. Every progress
      #     marker in both channels was a `:put`, and whether `/import`
      #     echoes `:put` output to the terminal at all was never tested on
      #     hardware -- the spec logs it as AC-4.5 ("resolve this on real
      #     hardware before implementing AC-4.1") and nobody did. If it
      #     does not echo, the operator reads nothing and the whole fix for
      #     "the script executed, RADIUS wasn't there" is void with no
      #     symptom. Markers now go to BOTH `:put` and `:log info`, so the
      #     question no longer decides whether they work, and the `/log`
      #     route is also the better record when `:put` DOES echo (a
      #     30-chunk import scrolls a WinBox buffer).
      #
      #     15.1's "the renderer invents no executable statements" guard
      #     was NOT loosened to allow the second sink. Its marker exemption
      #     was `line.includes("### cloudguest")` -- a hole with a password,
      #     which graded `/system reboot # ### cloudguest` as a legal
      #     marker. It is now (a) a strict single-statement shape and (b)
      #     set-equality against `progressMarkerStatements`, the renderers'
      #     own enumeration. The exemption got narrower while the exempted
      #     set got bigger.
      #
      #     15.1b is new and pins the third edge nothing asserted: the .rsc
      #     and the flattened paste are the same statement list, in order.
      #     That property was measured by hand and never gated, which is
      #     exactly how the .rsc went a month with no markers while the
      #     paste had 65.
      #
      #  2. A DELIBERATELY-PARTIAL PROVISION WAS TRUSTED, NOT GATED.
      #     Section 16. Three things said "this script has no RADIUS" and
      #     none of them stopped anything, so the state was reachable by
      #     not noticing. A partial provision now requires a TYPED
      #     acknowledgement at the deselect -- the consequence, "NO GUEST
      #     LOGIN", not the subsystem name -- and `deliberate: true`
      #     without one demotes the gap to a failure, which `:error`s. The
      #     gate is at the deselect and not at Generate or Download
      #     deliberately: a fourth dismissible warning is what three
      #     dismissible warnings produce.
      #
      # 198 checks added. 25 source-level mutations were injected into the
      # real generator and the real panel and this suite re-run; the first
      # pass left 2 alive (the `.rsc` header's /log instruction, matched
      # anywhere in the file rather than in the header -- an unrelated
      # chunk already prints that string -- and the deselect gate's phrase
      # comparison, which was source-grepped and could be replaced with
      # "accept anything" while every grep still matched). Both were
      # fixed: the header check is scoped to the `#` prologue, and the
      # grading is now a pure exported function this suite CALLS. All 25
      # caught on the second pass.
      #
      # FLOOR: 3265, against 3279 observed green. Tight on purpose --
      # deleting one assertion block fails the build -- with just enough
      # slack that correcting a single vacuous check does not.
      - name: setup script generator
        run: |
          ./scripts/ci-gated-test.sh \
            "setup-script-generator" 3265 \
            "setup-script-generator: all checks passed" \
            bun run test:setup-script

      # This one prints only a verdict line, no per-check output, so its
      # floor is 0 and the sentinel is doing all the work.
      - name: portal a11y invariants
        run: |
          ./scripts/ci-gated-test.sh \
