      # possibly hold, and the status strip rendered "WireGuard: Reachable"
      # off `router.status === "online"` -- which is the WAN heartbeat and
      # says nothing about the tunnel. The operator was actively told the
      # tunnel was fine.
      #
      # Both load-bearing directions are asserted and both are mutation-
      # verified in the script's own header: an unrecognised backend status
      # must degrade to `unknown` rather than `pass`, and `unknown` must
      # never render as a clean bill of health. It also checks the
      # source-level wiring, since a correct predicate connected to nothing
      # is the same bug in a disguise.
      #
      # Floor 19, observed green at 19 on 2026-08-23. Set at the observed
