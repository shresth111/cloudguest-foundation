      # --- Fleet wizard API paths ---------------------------------------
      #
      # The suite the header above has always listed at "5 checks", which
      # until now ran nowhere: it was appended to the step above as
      # `"$RUNNER" ...`, and $RUNNER is set by nothing. An unset variable
      # expands to the empty string, bash reports "command not found", and
      # the step exits 127 -- so this job has been RED on every push to
      # main since it landed, and the whole `tests` job with it. The
      # discovery-preflight suite on the line above it did run and pass;
      # everything after the 127 did not.
      #
      # Given its own step, with the same three gates as every suite here.
      # It is the regression test for the Fleet Wizard's WAN endpoint
      # 404'ing from the day it shipped -- the frontend path was missing
      # the backend router's /network-config prefix, and the docs recorded
      # it without the prefix too, so the docs could not catch it either.
      #
      # Floor 5, observed green at 5.
      - name: fleet wizard API paths
        run: |
          ./scripts/ci-gated-test.sh \
            "api-paths" 5 "all checks passed" \
            bun run test:api-paths

      # Device health & interface traffic. The customer-facing numbers here
      # are all DIFFERENCES between two cumulative IF-MIB octet counters,
      # so the derivation is the entire feature and it fails silently
      # rather than loudly. The load-bearing guards: a counter reset (a
      # device reboot) must render as a GAP, never as an abs() spike
      # placed at exactly the moment the device was least healthy; a
      # missing reading must never become a 0 that reads as "idle"; and
      # the router-API rows interleaved into the same table on a different
      # cadence must be skipped, not zeroed. Also gates the naming
      # discipline (docs/ipdr-logs-syslog-spec.md §5 -- this is not
      # "SNMP logs") and that no SNMP credential or config field reaches
      # any customer-facing module.
      #
      # Floor 40, observed green at 40.
      - name: device health and interface traffic
        run: |
          ./scripts/ci-gated-test.sh \
            "device-health" 40 "all checks passed" \
            bun run test:device-health

      # --- Customer dashboard KPI figures --------------------------------
      #
      # Two numbers that were shipping wrong to venue owners on the
      # most-viewed screen in the product, both found by the 2026-09-05
      # frontend feature audit:
      #
      #   1. "avg session" was `sum(bytes_downloaded)/count/1e6` rendered
      #      as `${n} min` -- average megabytes wearing a time unit. It
      #      survived because it was unfalsifiable by eye: plausible-looking
      #      at a streaming venue, plausible-looking at a coffee shop.
      #   2. SLA uptime printed via `.toFixed(1)`, which rounds to nearest,
      #      so anything from 99.95 up became a flat "100.0%". The demo
      #      fixture is 99.97, which is why the product video advertises a
      #      perfect 100% -- and why a customer fresh off an outage could be
      #      told the month was clean.
      #
      # The load-bearing assertion is that uptime NEVER rounds up to 100.
      # Floor 47, observed green at 47.
      - name: customer dashboard KPIs
        run: |
          ./scripts/ci-gated-test.sh \
            "customer-kpis" 47 "all customer KPI checks passed" \
            bun run test:customer-kpis

      # --- Customer sidebar permission filter ----------------------------
      #
      # "Each staff member sees only what their job needs" used to be
      # decided by a radio button on the sign-in form, stashed in
      # localStorage -- so a front-desk account that picked "Owner" got the
      # owner's entire sidebar, while the permission keys an owner really
      # saves in Staff Access -> Roles drove nothing in that shell.
      #
      # The fix is the dangerous direction here, not the bug: the backend
      # resolves permissions purely from role assignments with no superuser
      # bypass, so an account with no assignment resolves to `[]`. Getting
      # this wrong empties a paying customer's sidebar. The load-bearing
      # assertions are therefore the fail-open ones -- null (in flight),
      # undefined (fetch failed) and [] (no role) must every one of them
      # leave the nav untouched -- plus the two permission keys that would
      # be WRONG if inferred from the nav id (port-forwarding is gated on
      # firewall.*, admin-logs on audit_logs.*).
      #
      # Floor 35, observed green at 35.
      - name: customer sidebar permissions
        run: |
          ./scripts/ci-gated-test.sh \
            "customer-nav-permissions" 35 "all customer nav permission checks passed" \
            bun run test:customer-nav-permissions

      # --- Campaign results ----------------------------------------------
      #
      # The read half of a feature whose write half shipped months ago: an
      # owner could author a star-rating question, guests really answered
      # it, and nothing in the dashboard ever read a single reply back.
      # GET /campaigns/{id}/results existed with no caller, so the admin
      # table hardcoded impressions/conversions to 0 for every real
      # campaign while the demo fixtures showed 2841/423.
      #
      # The subtle one this pins: the backend types rating_distribution as
      # dict[int, int], but JSON object keys are always strings, so a
      # consumer doing dist[5] reads undefined and every star bar renders
      # zero -- indistinguishable from "nobody rated us".
      #
      # Floor 28, observed green at 28.
      - name: campaign results
        run: |
          ./scripts/ci-gated-test.sh \
            "campaign-results" 28 "all campaign results checks passed" \
            bun run test:campaign-results

      # --- CSV export escaping -------------------------------------------
      #
      # Security-relevant, not cosmetic: guest-supplied free text reaches
      # these files, and the backend's normalize_redeemed_identifier only
      # strips whitespace by design, so a guest can register an identifier
      # that is a spreadsheet formula. A venue owner opening the export in
      # Excel would execute it. The mitigation is one character and is easy
      # to lose in a refactor.
      #
      # The helpers were extracted from UserReports when the Users screen
      # gained its own guest-list export, so the second surface could not
      # ship a less careful copy. This guards the shared one.
      #
      # Floor 27, observed green at 27.
      - name: CSV export escaping
        run: |
          ./scripts/ci-gated-test.sh \
            "csv-export" 27 "all CSV export checks passed" \
            bun run test:csv-export

      # --- Connection Tools: a failed check must not read as a success ---
      #
      # The backend records a ping that reached nothing as
      # `status: "success"` with `received: 0, loss: 100` -- correct from
      # its point of view, because the command it was asked to run ran. The
      # page coloured everything off that field, so a venue whose internet
      # was down got a green tick, a green "Success" tile and a green toast,
      # on a page headed "Trouble connecting or opening a site? Fix it right
      # here."
      #
      # "Did the command execute" and "did the target answer" are different
      # questions and only the first was being asked. The regression risk is
      # ordinary: `status` is the obvious field to reach for, and reaching
      # for it looks right in review.
      #
      # Floor 36, observed green at 37. The count moved when the page this
      # suite's section 7 pointed at was rebuilt as
      # components/customer/FixAProblem.tsx: three of those wiring checks
      # guarded controls that no longer exist (the KPI tile, the
      # ping/traceroute toast, the history-row status dot) and were
      # replaced by checks that they STAY deleted. The pure-logic sections
      # 1-6, which are the ones that would catch the original bug, are
      # untouched. Floor left at 36 rather than raised to 37 so it remains
      # a floor rather than a tripwire on the exact number.
      - name: Diagnostics verdict
        run: |
          ./scripts/ci-gated-test.sh \
            "diagnostics-verdict" 36 "all diagnostics verdict checks passed" \
            bun run test:diagnostics-verdict

      # --- Fix a Problem: the verdict ladders ----------------------------
      #
      # The page a venue owner opens when a guest says the WiFi is broken.
      # Its failure modes are all ways of saying something untrue to the
      # person least able to check it, and the first is the expensive one:
      #
      # THE MANAGEMENT TUNNEL RIDES THE VENUE'S OWN WAN. When their line
      # goes down we lose the router with it -- so "we cannot reach your
      # router" is what an outage LOOKS like from here. There are two
      # unreachable states, and putting the reassuring one ("we can't reach
      # your router, but your internet looks fine") in front of a venue
      # that is actually dark is the worst thing this page can do. The
      # first assertions in this suite are exactly that, and swapping the
      # two rungs fails eight of them.
      #
      # It also pins the three things the hardware makes permanent: no
      # signal strength or dBm anywhere (the fleet is a wired five-port
      # MikroTik with no radio to ask), no composite health score, and no
      # SSID -- there is no SSID model in the product, and the last time
      # the frontend needed one it invented four.
      #
      # And it pins the honest-absence rule: when everything measurable is
      # healthy the verdict is the wireless boundary, NOT a green tick, and
      # the rungs that cannot be checked yet (login history, hotspot host)
      # are rendered rather than silently skipped.
      #
      # Floor 70, observed green at 78.
      - name: Connection verdicts
        run: |
          ./scripts/ci-gated-test.sh \
            "connection-verdicts" 70 "all connection verdict checks passed" \
            bun run test:connection-verdicts

      # --- Guest walkthrough: the voucher step ---------------------------
      #
      # Voucher is the one sign-in method whose submit does not live in
      # `useGuestSignIn`, so it never inherited that hook's demo/preview
      # short-circuits. It is a separate ROUTE, reached by a real router
      # `<Link>`, and following that link out of a preview lands on the
      # LIVE guest portal for that venue -- where `loginWithVoucher`
      # creates a REAL `GuestSession` against a real customer, from a
      # screen everyone present believes is a demonstration. That is the
      # worst thing this surface can do, and neither tsc nor eslint nor a
      # grep can see it.
      #
      # So this suite drives the REAL `DemoPortalFlow`/`GuestSignInCard`/
      # `VoucherForm` in a real Chromium (reusing the Chromium installed
      # above for test:signin-fields -- no new CI infrastructure) and
      # asserts BOTH directions:
      #   - a walkthrough voucher sign-in makes no `loginWithVoucher`
      #     call, no other service call, no navigation (which is what
      #     keeps /portal/success, the only NAS hotspot POST, out of
      #     reach), and no fetch/XHR/beacon of any kind -- the last of
      #     those wrapped in the page itself, so a request by a route
      #     nothing here anticipated still fails the build;
      #   - a REAL guest's submit still calls `loginWithVoucher` exactly
      #     once, with exactly the identifier/code/org/location/router it
      #     always did. "The demo is safe" is trivially satisfiable by
      #     breaking the real path, so the real path is asserted too.
      # Plus the honesty of the two screens involved: the step must say
      # any code is accepted and that nothing is redeemed or marked used,
      # and must never claim a voucher was validated.
      #
      # Five mutations of the real source were injected and this suite
      # re-run; all five caught, in both directions. See the script header
      # for the table.
      #
      # Floor 51, observed green at 51. Set at the observed count rather
      # than below it: this suite does not scale with content, so any drop
      # is an assertion disappearing.
      - name: guest walkthrough voucher step
        run: |
          ./scripts/ci-gated-test.sh \
            "voucher-walkthrough" 51 \
            "voucher-walkthrough: all checks passed" \
            bun run test:voucher-walkthrough
      # In package.json since it was written, gated nowhere until now: it
      # has been passing this whole time and proving nothing, the exact
      # state this file's header already records for test:portal-cna (which
      # rotted on origin/main) and test:discovery-preflight. Found while
      # auditing the router endpoints for the credential-scope fix.
      #
      # What it actually protects: liveness is DERIVED from `last_seen_at`
      # against the clock, not stored, so it silently drifts rather than
      # breaking loudly -- an "unknown" router must not be painted as
      # offline, and the master console's summary counts have to move as
      # time passes. Both are the kind of wrong that looks perfectly
      # plausible on screen.
      #
      # Floor 105, observed green at 105.
      - name: location liveness
        run: |
          ./scripts/ci-gated-test.sh \
            "location-liveness" 105 "all checks passed" \
            bun run test:location-liveness

      # Same "gated nowhere" state, found the same way. Both of these were
      # wired into the Jenkinsfile when they shipped and into no GitHub
      # Actions step at all -- and it is this workflow, not Jenkins, that
      # gates a pull request. So 30 checks have been running on nothing that
