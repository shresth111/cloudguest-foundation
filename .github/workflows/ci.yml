      #
      # The round-trip suite is the one that matters most: portal.service.ts
      # has a write-path serialization whitelist, and a field mapped on read
      # but missing there is silently discarded on save. That has already
      # shipped as a real bug in that exact file (`fontFamily` was a live UI
