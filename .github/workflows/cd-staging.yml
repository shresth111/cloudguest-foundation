name: CD Staging

# Continuous deployment of the frontend container to the staging app server
# (wyfy-staging-server, i-0a6a08bb87c6f0f84 in ap-south-1).

on:
  push:
    branches: [staging]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Commit SHA to deploy to staging (blank = build and deploy this ref)."
        required: false
        default: ""

concurrency:
  group: cd-frontend-staging
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  # Granted at the workflow level because this workflow CALLS ci.yml, and a
  # reusable workflow's jobs cannot request a permission the caller did not
  # grant. ci.yml's notify job asks for `actions: read` (it reads the run's
  # start time to report a duration); without this line every run of this
  # workflow dies with `startup_failure` before a single job is scheduled --
  # no logs, no jobs, and nothing in the UI that names the missing scope.
  actions: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: wyfy/frontend
  INSTANCE_ID: ${{ vars.AWS_STAGING_INSTANCE_ID }}
  VITE_API_BASE_URL: /api/v1

jobs:
  ci:
    name: CI
    if: github.event.inputs.image_tag == ''
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push to ECR
    needs: ci
    if: always() && (needs.ci.result == 'success' || github.event.inputs.image_tag != '')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.image_tag || github.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image ref
        id: meta
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          SHA="${{ github.event.inputs.image_tag || github.sha }}"
          echo "image=$REGISTRY/$ECR_REPOSITORY:staging-$SHA" >> "$GITHUB_OUTPUT"
          echo "sha=staging-$SHA" >> "$GITHUB_OUTPUT"

      - name: Reuse the existing image if this SHA is already in ECR
        id: exists
        run: |
          if aws ecr describe-images --region "$AWS_REGION" \
               --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="${{ steps.meta.outputs.sha }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.meta.outputs.image }} already exists; skipping build."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.exists.outputs.found == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image serves HTTP
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 13000:3000 "${{ steps.meta.outputs.image }}"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13000/ || echo 000)
            [ "$CODE" = "200" ] && { echo "smoke ok: HTTP 200"; docker rm -f smoke >/dev/null; exit 0; }
            sleep 2
          done
          echo "::error::the image never served HTTP 200 on :3000"
          docker logs smoke || true
          docker rm -f smoke >/dev/null || true
          exit 1

  deploy:
    name: Deploy to staging server
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.wyfyguest.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check the staging instance is registered with SSM
        run: |
          COUNT=$(aws ssm describe-instance-information \
            --region "$AWS_REGION" \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'length(InstanceInformationList)' --output text)
          if [ "$COUNT" != "1" ]; then
            echo "::error::$INSTANCE_ID is not registered with SSM."
            exit 1
          fi

      - name: Send deploy command
        id: send
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          SCRIPT_B64=$(base64 deploy/remote-deploy.sh | tr -d '\n')
          jq -n --arg b64 "$SCRIPT_B64" --arg image "$IMAGE" '{
            commands: [
              "set -eu",
              ("echo \($b64) | base64 -d > /tmp/remote-deploy.sh"),
              "chmod 0755 /tmp/remote-deploy.sh",
              ("sudo -u ubuntu -H env AWS_REGION=ap-south-1 /tmp/remote-deploy.sh frontend \($image)"),
              "rm -f /tmp/remote-deploy.sh"
            ]
          }' > params.json

          CMD_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "CD Staging frontend ${GITHUB_SHA:0:7}" \
            --timeout-seconds 600 \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $CMD_ID"

      - name: Wait for the deploy to finish
        env:
          CMD_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -uo pipefail
          sleep 15
          DEADLINE=$(( SECONDS + 900 ))
          STATUS=Pending
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            STATUS=$(aws ssm get-command-invocation --region "$AWS_REGION" \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          echo "----- stdout -----"
          aws ssm get-command-invocation --region "$AWS_REGION" \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text || true
          echo "----- stderr -----"
          aws ssm get-command-invocation --region "$AWS_REGION" \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text || true
          echo "----- status: $STATUS -----"
          [ "$STATUS" = "Success" ] || exit 1

      - name: Verify staging endpoint
        run: |
          set -euo pipefail
          echo "Verifying staging server responds on Elastic IP..."
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://13.207.123.212/?cb=$(date +%s)" || echo 000)
            echo "attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && { echo "Staging IP serving 200 OK"; break; }
            sleep 5
          done
          echo "Staging deployment verified."

  # ---------------------------------------------------------------------------
  # Slack
  # ---------------------------------------------------------------------------
  # EVERY OUTCOME, unlike CI. A deploy is rare, it changes what is serving
  # production traffic, and "it worked" is itself the thing people want to
  # know -- there is no way to tell a successful deploy from one that never
  # started, other than being told.
  #
  # `needs` covers the whole pipeline rather than just `deploy`, because the
  # interesting failures are the ones where deploy never ran: a failed `ci`
  # leaves build and deploy *skipped*, not failed, and a notifier watching
  # only its own outcome would have nothing to say about the run that mattered
  # most. The action folds the per-job results into one status, failure first.
  #
  # Nothing about the deploy above is changed by this job -- it has its own
  # runner, its own (smaller) permissions, no AWS credentials, and it cannot
  # run until deploy has already reached a conclusion.
  notify:
    name: Tell Slack how the deploy went
    needs: [ci, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    # Deliberately does not inherit the workflow's `id-token: write`: this job
    # has no business minting an OIDC token for the deploy role.
    permissions:
      actions: read
      contents: read
    steps:
      # The action lives in this repository, so it has to be on disk before it
      # can be used. Sparse-checked-out: this job wants one action.yml, not a
      # backend, a node_modules-sized frontend, or a vendored gateway.
      - name: Check out the composite action
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Notify
        uses: ./.github/actions/slack-notify
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          needs_json: ${{ toJSON(needs) }}
          kind: CD
          environment: staging
          # Empty when the build job was skipped, which the action handles by
          # leaving the field out rather than printing an empty one.
          image: ${{ needs.build.outputs.image }}
          # On a workflow_dispatch rollback the thing that shipped is an older
          # commit than the ref this run is on; say which one it actually was.
          commit_sha: ${{ github.event.inputs.image_tag || github.sha }}
