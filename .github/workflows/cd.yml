name: CD

# Continuous deployment of the frontend container to the app server,
# in ap-south-1. It serves app./portal./master./auth.
# wyfyguest.com behind the host-level nginx, which proxies everything that is
# not /api/ to 127.0.0.1:3000.
#
# HOW A GITHUB RUNNER REACHES A BOX THAT HAS NO INBOUND SSH
# ---------------------------------------------------------
# GitHub OIDC -> an AWS IAM role -> SSM SendCommand. No long-lived AWS key on
# the runner, and nothing new opened inbound: the SSM agent polls OUT to
# Systems Manager, so port 22 stays shut to the internet. An SSH key in a
# GitHub secret was rejected -- GitHub-hosted runners have dynamic egress, so
# it would mean opening 22 to effectively the whole internet on a box that
# terminates four production hostnames.
#
# WHY THE IMAGE IS BUILT HERE AND NOT ON THE BOX
# ----------------------------------------------
# The box is a 2 vCPU m6i.large with ~1 GB free RAM while serving live
# traffic; a bun/vite build next to uvicorn and two celery workers is a
# latency incident. And the checkout under ~/deploy/cloudguest-foundation is
# can be dirty, so "git pull and build" would ship whatever a human left in
# the working tree. (It was dirty when this was written and is clean again
# now -- see the CORRECTION in deploy/remote-deploy.sh. The durable reason is
# the backend's `.env`, which lives only on the box and which a
# `git checkout -f` deploy would delete.)
#
# VITE_API_BASE_URL
# -----------------
# Vite inlines import.meta.env.VITE_* AT BUILD TIME -- it cannot be a runtime
# `-e`. It is passed as a build arg here, which is the same place the box's
# old compose `build.args` set it, so the value that ships is unchanged. It
# is deliberately the relative "/api/v1": the bundle runs in the visitor's
# browser and this stack answers on four different hostnames, each of whose
# nginx server blocks proxies /api/ to the same backend. An absolute value
# works on exactly one of them and silently breaks login and OTP on the rest.

#
# ROLLBACK INPUT AND WHAT THE (PUBLIC) LOG MAY SHOW
# -------------------------------------------------
# A workflow_dispatch image_tag skips CI, so it is checked before anything uses
# it: a full 40-character lowercase hex SHA that is an ancestor of origin/main.
# It reaches a shell only through `env:`, never inline in `run:`.
#
# These logs are world-readable. Every AWS job starts by registering the deploy
# role ARN, its name, the account id and the instance id with `::add-mask::`.
# Values come from secrets (AWS_DEPLOY_ROLE_ARN, APP_INSTANCE_ID) when set -- masked from the first line -- and
# fall back to the repository variables of the same name. Job outputs carry
# only the tag and repo:tag, never the registry host, because GitHub drops a
# job output that contains a masked value.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Commit SHA to deploy (blank = build and deploy this ref). Use an older SHA to roll back."
        required: false
        default: ""

# Never cancel a deploy in flight: a half-applied `docker compose up` is worse
# than a queued one. Deploys serialise instead.
concurrency:
  group: cd-frontend
  cancel-in-progress: false

permissions:
  id-token: write   # required to mint the OIDC token
  contents: read
  # Granted at the workflow level because this workflow CALLS ci.yml, and a
  # reusable workflow's jobs cannot request a permission the caller did not
  # grant. ci.yml's notify job asks for `actions: read` (it reads the run's
  # start time to report a duration); without this line every run of this
  # workflow dies with `startup_failure` before a single job is scheduled --
  # no logs, no jobs, and nothing in the UI that names the missing scope.
  actions: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: wyfy/frontend
  VITE_API_BASE_URL: /api/v1

jobs:
  # Gate on the existing CI rather than restating it. ci.yml gained an
  # `on.workflow_call` trigger for this, so tsc, eslint and all eleven
  # ci-gated-test.sh suites stay defined in exactly one place -- including
  # the setup-script and output-analyser floors, which are the only thing
  # standing between a bad generator change and a bricked router in the field.
  ci:
    name: CI
    if: github.event.inputs.image_tag == ''
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push to ECR
    needs: ci
    if: always() && (needs.ci.result == 'success' || github.event.inputs.image_tag != '')
    runs-on: ubuntu-latest
    outputs:
      # The SHA and repo:tag only. The full ref contains the (masked) account
      # id, and GitHub drops any job output that contains a masked value.
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
      image_name: ${{ steps.meta.outputs.image_name }}
    steps:
      - name: Mask infrastructure identifiers
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is set neither as a secret nor as a variable."
            exit 1
          fi
          ACCOUNT_ID="$(cut -d: -f5 <<<"$ROLE_ARN")"
          echo "::add-mask::$ROLE_ARN"
          echo "::add-mask::${ROLE_ARN##*/}"
          echo "::add-mask::$ACCOUNT_ID"
          echo "masked: deploy role, role name, account id"

      # Runs BEFORE checkout: nothing touches the input until it is proven to
      # be a bare SHA. Ancestry is checked after checkout, below.
      - name: Validate the rollback SHA
        id: sha
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$IMAGE_TAG" ]; then
            echo "sha=$DEFAULT_SHA" >> "$GITHUB_OUTPUT"
            echo "rollback=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::image_tag must be a full 40-character lowercase commit SHA."
            exit 1
          fi
          echo "sha=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "rollback=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.sha.outputs.sha }}
          # A rollback needs main's history to prove ancestry; a normal
          # push does not, and a full clone is slower.
          fetch-depth: ${{ steps.sha.outputs.rollback == 'true' && '0' || '1' }}

      - name: Require the rollback SHA to be on main
        if: steps.sha.outputs.rollback == 'true'
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not an ancestor of origin/main. Only commits that were merged to main (and so passed CI there) can be redeployed."
            exit 1
          fi
          echo "rollback target $SHA is on main"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Resolve image ref
        id: meta
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          {
            echo "image=$REGISTRY/$ECR_REPOSITORY:$SHA"
            echo "image_name=$ECR_REPOSITORY:$SHA"
            echo "tag=$SHA"
          } >> "$GITHUB_OUTPUT"

      # A workflow_dispatch rollback names a SHA that was already built and
      # pushed. Rebuilding it would be slower and, if a base image moved,
      # would not even produce the same artifact -- so reuse it if it exists.
      - name: Reuse the existing image if this SHA is already in ECR
        id: exists
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          IMAGE_NAME: ${{ steps.meta.outputs.image_name }}
        run: |
          if aws ecr describe-images --region "$AWS_REGION" \
               --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$IMAGE_NAME already exists; skipping build."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.exists.outputs.found == 'false'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          push: true
          # linux/amd64 only. The instance is x86_64 (m6i.large) and a
          # multi-arch build would double build time for a layer nothing pulls.
          platforms: linux/amd64
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Dockerfile's builder stage runs `bun run build` and asserts
      # nothing about the result. The nitro preset is the specific way this
      # image has been wrong while building green: without NITRO_PRESET the
      # @lovable.dev config defaults to "cloudflare-module", which produces a
      # Worker bundle that `node .output/server/index.mjs` cannot run. The
      # Dockerfile pins the preset -- this proves it took.
      #
      # Deliberately NOT gated on steps.exists.outputs.found. This step used to
      # carry `if: steps.exists.outputs.found == 'false'`, which opened a hole:
      # docker/build-push-action PUSHES as part of the build, so an image whose
      # smoke test then FAILED is already in ECR under that SHA. Re-running the
      # workflow for that SHA found it, skipped the build AND skipped this
      # check, and shipped a known-bad image with nothing left to catch it but
      # the on-box health gate.
      #
      # Running it unconditionally costs one `docker pull` on the reuse path
      # (the ECR login above already authenticated the runner) and makes the
      # rollback path prove the artifact starts, rather than assuming it does
      # because it once got as far as being pushed.
      - name: Smoke-test the image serves HTTP
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 13000:3000 "$IMAGE"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13000/ || echo 000)
            [ "$CODE" = "200" ] && { echo "smoke ok: HTTP 200"; docker rm -f smoke >/dev/null; exit 0; }
            sleep 2
          done
          echo "::error::the image never served HTTP 200 on :3000"
          docker logs smoke || true
          docker rm -f smoke >/dev/null || true
          exit 1

  deploy:
    name: Deploy to app server
    needs: build
    runs-on: ubuntu-latest
    # Attach required reviewers / a wait timer to this environment in repo
    # settings if frontend deploys should need a human. Leaving it with no
    # protection rules makes this fully continuous; the environment exists so
    # that is a setting rather than a rewrite.
    environment:
      name: production
      url: https://app.wyfyguest.com
    steps:
      # Same masking as the build job, plus the instance id. INSTANCE_ID and
      # ACCOUNT_ID go to GITHUB_ENV only after they are masked, so every later
      # step header shows ***.
      - name: Mask infrastructure identifiers
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          APP_INSTANCE_ID: ${{ secrets.APP_INSTANCE_ID || vars.APP_INSTANCE_ID }}
        run: |
          set -euo pipefail
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is set neither as a secret nor as a variable."
            exit 1
          fi
          if [ -z "$APP_INSTANCE_ID" ]; then
            echo "::error::The target EC2 instance id is not configured (see the masking note at the top of this file)."
            exit 1
          fi
          ACCOUNT_ID="$(cut -d: -f5 <<<"$ROLE_ARN")"
          echo "::add-mask::$ROLE_ARN"
          echo "::add-mask::${ROLE_ARN##*/}"
          echo "::add-mask::$ACCOUNT_ID"
          echo "::add-mask::$APP_INSTANCE_ID"
          echo "INSTANCE_ID=$APP_INSTANCE_ID" >> "$GITHUB_ENV"
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "masked: deploy role, role name, account id, instance id"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      # Fail with a sentence a human can act on, rather than with a 60-second
      # SendCommand timeout, when the instance is not registered with SSM.
      # (It was not, on 2026-08-27: the agent runs, but the instance role had
      # no ssm:UpdateInstanceInformation. See the enable-list.)
      - name: Check the instance is registered with SSM
        run: |
          COUNT=$(aws ssm describe-instance-information \
            --region "$AWS_REGION" \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'length(InstanceInformationList)' --output text)
          if [ "$COUNT" != "1" ]; then
            echo "::error::The target instance is not registered with SSM."
            echo "The agent is installed and running on the box; what it needs is"
            echo "AmazonSSMManagedInstanceCore attached to the instance role."
            exit 1
          fi

      - name: Send deploy command
        id: send
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          # Rebuilt here rather than passed from the build job: the registry
          # host contains the masked account id, and a job output containing a
          # masked value is dropped.
          IMAGE="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$TAG"
          # The script is shipped inside the command payload rather than kept
          # on the box, so the version that runs is always the version in this
          # commit and there is no bootstrap step to forget. base64 keeps the
          # quoting out of the JSON entirely.
          SCRIPT_B64=$(base64 -w0 deploy/remote-deploy.sh)

          # Runs as ubuntu, not root: ~/deploy and everything in it is
          # ubuntu-owned, and a root-written .deploy.env would break the next
          # deploy. ubuntu is already in the docker group.
          jq -n --arg b64 "$SCRIPT_B64" --arg image "$IMAGE" '{
            commands: [
              "set -eu",
              ("echo \($b64) | base64 -d > /tmp/remote-deploy.sh"),
              "chmod 0755 /tmp/remote-deploy.sh",
              ("sudo -u ubuntu -H env AWS_REGION=ap-south-1 /tmp/remote-deploy.sh frontend \($image)"),
              "rm -f /tmp/remote-deploy.sh"
            ]
          }' > params.json

          CMD_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "CD frontend ${GITHUB_SHA:0:7}" \
            --timeout-seconds 600 \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $CMD_ID"

      - name: Wait for the deploy to finish
        env:
          CMD_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -uo pipefail
          # 15s of grace: get-command-invocation 400s with InvocationDoesNotExist
          # for a moment after send-command returns.
          sleep 15
          DEADLINE=$(( SECONDS + 900 ))
          STATUS=Pending
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            STATUS=$(aws ssm get-command-invocation --region "$AWS_REGION" \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          echo "----- stdout -----"
          aws ssm get-command-invocation --region "$AWS_REGION" \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text || true
          echo "----- stderr -----"
          aws ssm get-command-invocation --region "$AWS_REGION" \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text || true

          # get-command-invocation truncates at 24,000 characters. If a deploy
          # is being debugged from a truncated log, add an S3 output config to
          # send-command above rather than guessing.
          echo "----- status: $STATUS -----"
          [ "$STATUS" = "Success" ] || exit 1

      # Independent of the box's own healthcheck: proves the deployed bundle
      # is reachable through the real nginx on the real hostname over real
      # TLS. The container reporting healthy and the site being up are not the
      # same claim -- the container healthcheck curls 127.0.0.1:3000 from
      # inside itself and knows nothing about nginx or the certificate.
      - name: Verify through the public endpoints
        run: |
          set -euo pipefail
          FAILED=0
          for HOST in app.wyfyguest.com portal.wyfyguest.com master.wyfyguest.com; do
            OK=0
            for i in 1 2 3 4 5 6; do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' \
                "https://$HOST/?cb=$(date +%s)" || echo 000)
              [ "$CODE" = "200" ] && { OK=1; break; }
              sleep 10
            done
            if [ "$OK" = "1" ]; then echo "$HOST -> 200"; else
              echo "::error::$HOST did not return 200 after the deploy."
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "The container passed its own healthcheck, so suspect nginx or TLS"
            echo "rather than the image. The previous image is still in ECR:"
            echo "  gh workflow run cd.yml -f image_tag=<previous-sha>"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Slack
  # ---------------------------------------------------------------------------
  # EVERY OUTCOME, unlike CI. A deploy is rare, it changes what is serving
  # production traffic, and "it worked" is itself the thing people want to
  # know -- there is no way to tell a successful deploy from one that never
  # started, other than being told.
  #
  # `needs` covers the whole pipeline rather than just `deploy`, because the
  # interesting failures are the ones where deploy never ran: a failed `ci`
  # leaves build and deploy *skipped*, not failed, and a notifier watching
  # only its own outcome would have nothing to say about the run that mattered
  # most. The action folds the per-job results into one status, failure first.
  #
  # Nothing about the deploy above is changed by this job -- it has its own
  # runner, its own (smaller) permissions, no AWS credentials, and it cannot
  # run until deploy has already reached a conclusion.
  notify:
    name: Tell Slack how the deploy went
    needs: [ci, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    # Deliberately does not inherit the workflow's `id-token: write`: this job
    # has no business minting an OIDC token for the deploy role.
    permissions:
      actions: read
      contents: read
    steps:
      # The action lives in this repository, so it has to be on disk before it
      # can be used. Sparse-checked-out: this job wants one action.yml, not a
      # backend, a node_modules-sized frontend, or a vendored gateway.
      - name: Check out the composite action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Notify
        uses: ./.github/actions/slack-notify
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          needs_json: ${{ toJSON(needs) }}
          kind: CD
          environment: production
          # Empty when the build job was skipped, which the action handles by
          # leaving the field out rather than printing an empty one.
          image: ${{ needs.build.outputs.image_name }}
          # On a workflow_dispatch rollback the thing that shipped is an older
          # commit than the ref this run is on; say which one it actually was.
          commit_sha: ${{ needs.build.outputs.sha || github.sha }}
